[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ia-assistant-local"
version = "0.1.0"
description = "Assistente local seguro para computador e Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pypdf>=5,<7", "reportlab>=4,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
ia-assistant = "ia_assistant_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_assistant_local"]

[tool.hatch.build]
include = ["src/ia_assistant_local/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

